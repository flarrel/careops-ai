apiVersion: v1
kind: Namespace
metadata:
  name: careops
  labels:
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: careops
  namespace: careops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: careops
  template:
    metadata:
      labels:
        app: careops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: careops-ops13:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: {path: /ready, port: http}
            timeoutSeconds: 7
            periodSeconds: 4
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: model, mountPath: /service/models/qwen2.5-0.5b-instruct, readOnly: true}
            - {name: pdfs, mountPath: /service/data/raw, readOnly: true}
            - {name: runs, mountPath: /service/data/runtime}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: model
          hostPath: {path: /mnt/careops/model, type: Directory}
        - name: pdfs
          hostPath: {path: /mnt/careops/pdfs, type: Directory}
        - name: runs
          emptyDir: {}
        - name: temp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: careops
  namespace: careops
spec:
  selector:
    app: careops
  ports:
    - name: http
      port: 8000
      targetPort: http
