[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "careops-ai"
version = "0.1.0"
description = "Local-first cited policy and synthetic-claims assistant"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
providers = ["httpx==0.28.1", "httpx2==2.16.2", "anthropic==2.10.0"]
storage = [
  "chromadb==1.5.9",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.9",
  "pydantic-settings==2.9.1",
  "pymongo==4.20.0",
  "PyMySQL[rsa]==1.2.4",
  "redis==8.1.0",
]
integrations = [
  "django==6.1.3",
  "flask==3.1.3",
  "openpyxl==3.1.5",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
  "behave==1.3.3",
  "selenium==4.53.0",
]
app = ["streamlit==1.55.0", "httpx==0.28.1"]
finetune = [
  "numpy==2.5.4",
  "pillow==12.3.0",
  "torch==2.14.1",
  "pydantic==2.10.5",
  "transformers==4.47.1",
  "safetensors==0.8.0",
  "matplotlib==3.11.2",
]
models = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pillow==12.3.0",
  "pydantic==2.10.5",
  "scikit-learn==1.6.1",
  "tensorflow==2.21.0",
  "keras==3.15.1",
  "torch==2.14.1",
  "transformers==4.47.1",
  "matplotlib==3.11.2",
]
comparison = ["pypdf==7.1.1", "jsonschema==4.26.0", "pydantic>=2.10.5,<3"]
comparison-sk = ["semantic-kernel==1.37.0"]
comparison-adk = ["google-adk==1.18.0"]
comparison-autogen = ["autogen-core==0.7.5"]
agent = [
  "langgraph==0.2.60",
  "langchain-core==0.3.29",
  "pydantic==2.10.5",
]
rag = [
  "pypdf==7.1.1",
  "scikit-learn==1.6.1",
  "torch>=2.6,<3",
  "transformers==4.47.1",
  "fastapi==0.115.6",
  "pydantic==2.10.5",
  "uvicorn==0.34.0",
]
retrieval = [
  "pypdf==7.1.1",
  "scikit-learn==1.6.1",
  "torch>=2.6,<3",
  "transformers==4.47.1",
  "langchain-core==0.3.29",
  "llama-index-core==0.12.11",
  "pydantic==2.10.5",
]
data = ["pypdf==7.1.1"]
reduced = [
  "fastapi==0.115.6",
  "pydantic==2.10.5",
  "scikit-learn==1.6.1",
  "streamlit==1.55.0",
  "uvicorn==0.34.0",
]
full = [
  "langchain==0.3.14",
  "langgraph==0.2.60",
  "sentence-transformers==3.3.1",
  "transformers==4.47.1",
]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "ruff==0.9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
